# 只放行白名单里的域名（entrypoint.sh 按 SANDBOX_EGRESS_ALLOW_HOSTS 生成 /etc/tinyproxy/allow）
User tinyproxy
Group tinyproxy
Port 8888
Listen 0.0.0.0
Timeout 600
MaxClients 100
# 不写 LogFile / Syslog：日志输出到 stdout
LogLevel Notice
DisableViaHeader Yes
Filter "/etc/tinyproxy/allow"
FilterType ERE
FilterDefaultDeny Yes
# HTTPS 隧道只能连 443
ConnectPort 443
