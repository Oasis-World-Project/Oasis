# Oasis 本地编排。统一通过 scripts/compose.mjs 调用：
#   pnpm infra:up   只起中间件（日常开发：服务在本机进程里跑，热重载）
#   pnpm stack:up   中间件 + 9 个服务全部在容器里跑（集成验证）
#   pnpm infra:down 全部停掉
#
# 镜像命名规则（AGENTS.md B.10）：本项目运行的每个镜像都叫 oasis/<组件>:<标签>，没有例外。
# 中间件用 infra/images/<组件>/Dockerfile 薄包装官方镜像（上游版本在 Dockerfile 里锁定）。
# pull_policy: build 保证只在本地构建，绝不从镜像仓库拉取同名镜像（Docker Hub 上的 oasis 命名空间不归我们）。
name: oasis

# ---------- 9 个 Node 服务共用的片段 ----------
x-node-service: &node-service
  pull_policy: build
  profiles: [services]
  restart: unless-stopped
  stop_grace_period: 15s
  healthcheck:
    test:
      - CMD
      - node
      - -e
      - "fetch('http://127.0.0.1:'+process.env.PORT+'/ready').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"
    interval: 5s
    timeout: 3s
    retries: 20
    start_period: 10s

x-node-build: &node-build
  context: ../..
  dockerfile: infra/images/node-service/Dockerfile
  args: &node-build-args
    GIT_COMMIT: ${GIT_COMMIT:-unknown}

x-runtime-env: &runtime-env
  HOST: 0.0.0.0
  LOG_LEVEL: info
  SHUTDOWN_DRAIN_MS: 2000
  MIGRATE_ON_START: 'true'

x-nats-env: &nats-env
  NATS_URL: nats://nats:4222
  NATS_USER: ${NATS_USER:?}
  NATS_PASSWORD: ${NATS_PASSWORD:?}

x-data-deps: &data-deps
  postgres:
    condition: service_healthy
  nats:
    condition: service_healthy

services:
  postgres:
    image: oasis/postgres:18.6
    build: ../images/postgres
    pull_policy: build
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER:?}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?}
      POSTGRES_DB: postgres
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD:?}
      BILLING_DB_PASSWORD: ${BILLING_DB_PASSWORD:?}
      AGENT_DB_PASSWORD: ${AGENT_DB_PASSWORD:?}
      CONVERSATION_DB_PASSWORD: ${CONVERSATION_DB_PASSWORD:?}
      TASK_DB_PASSWORD: ${TASK_DB_PASSWORD:?}
      CANVAS_DB_PASSWORD: ${CANVAS_DB_PASSWORD:?}
      HARNESS_DB_PASSWORD: ${HARNESS_DB_PASSWORD:?}
      MODEL_GATEWAY_DB_PASSWORD: ${MODEL_GATEWAY_DB_PASSWORD:?}
    ports:
      - 127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d postgres']
      interval: 5s
      timeout: 3s
      retries: 20
    stop_grace_period: 30s

  valkey:
    image: oasis/valkey:9.1.2
    build: ../images/valkey
    pull_policy: build
    environment:
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:?}
    ports:
      - 127.0.0.1:${VALKEY_HOST_PORT:-6379}:6379
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'valkey-cli -a "$$VALKEY_PASSWORD" --no-auth-warning ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 20

  nats:
    image: oasis/nats:2.15.1
    build: ../images/nats
    pull_policy: build
    environment:
      NATS_USER: ${NATS_USER:?}
      NATS_PASSWORD: ${NATS_PASSWORD:?}
    ports:
      - 127.0.0.1:${NATS_HOST_PORT:-4222}:4222
      - 127.0.0.1:${NATS_MONITOR_HOST_PORT:-8222}:8222
    volumes:
      - nats-data:/data
    healthcheck:
      test:
        ['CMD-SHELL', 'wget -q -O /dev/null "http://127.0.0.1:8222/healthz?js-enabled-only=true"']
      interval: 5s
      timeout: 3s
      retries: 20

  seaweedfs:
    image: oasis/seaweedfs:4.47
    build: ../images/seaweedfs
    pull_policy: build
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?}
    ports:
      - 127.0.0.1:${S3_HOST_PORT:-8333}:8333
    volumes:
      - seaweedfs-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:8333/healthz']
      interval: 5s
      timeout: 3s
      retries: 30

  mailpit:
    image: oasis/mailpit:1.31.6
    build: ../images/mailpit
    pull_policy: build
    ports:
      - 127.0.0.1:${MAILPIT_SMTP_HOST_PORT:-1025}:1025
      - 127.0.0.1:${MAILPIT_UI_HOST_PORT:-8025}:8025
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 3s
      retries: 20

  # 沙箱入口代理（ADR 0003 §6）：沙箱容器在内部网络 oasis-sandbox 里，不通外网，只能访问它；
  # 它只放行 chat completions 和 Jev 决策两条路径，转到 model-gateway 的 /run/v1/*。
  # 本机开发时 model-gateway 跑在宿主机上，经 host.docker.internal 访问；pnpm stack:up 时改为容器里的 model-gateway。
  sandbox-ingress:
    image: oasis/sandbox-ingress:1.29.3
    build: ../images/sandbox-ingress
    pull_policy: build
    environment:
      MODEL_GATEWAY_UPSTREAM: ${SANDBOX_INGRESS_UPSTREAM:-http://host.docker.internal:4108}
    extra_hosts:
      - host.docker.internal:host-gateway
    networks: [default, sandbox]
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:8080/healthz']
      interval: 5s
      timeout: 3s
      retries: 20

  # ---------- 服务（profile: services）----------
  # 唯一对外的服务；不依赖上游先启动，某个上游挂了只影响它自己的路由
  gateway:
    <<: *node-service
    image: oasis/gateway:${OASIS_IMAGE_TAG:-local}
    build:
      <<: *node-build
      args:
        <<: *node-build-args
        SERVICE: gateway
    environment:
      <<: *runtime-env
      PORT: 8080
      IDENTITY_URL: http://identity:4101
      BILLING_URL: http://billing:4102
      AGENT_URL: http://agent:4103
      CONVERSATION_URL: http://conversation:4104
      TASK_URL: http://task:4105
      CANVAS_URL: http://canvas:4106
      GATEWAY_ALLOWED_ORIGINS: http://127.0.0.1:5173,http://localhost:5173
    ports:
      - 127.0.0.1:${GATEWAY_HOST_PORT:-8080}:8080

  identity:
    <<: *node-service
    image: oasis/identity:${OASIS_IMAGE_TAG:-local}
    build:
      <<: *node-build
      args:
        <<: *node-build-args
        SERVICE: identity
    environment:
      <<: [*runtime-env, *nats-env]
      PORT: 4101
      DATABASE_URL: postgres://svc_identity:${IDENTITY_DB_PASSWORD:?}@postgres:5432/identity?sslmode=disable
      SMTP_URL: smtp://mailpit:1025
      MAIL_FROM: Oasis <no-reply@oasis.local>
      AUTH_CODE_PEPPER: ${AUTH_CODE_PEPPER:?}
      # 本地是 http，会话 Cookie 不能要求 HTTPS
      COOKIE_SECURE: 'false'
    depends_on: *data-deps

  billing:
    <<: *node-service
    image: oasis/billing:${OASIS_IMAGE_TAG:-local}
    build:
      <<: *node-build
      args:
        <<: *node-build-args
        SERVICE: billing
    environment:
      <<: [*runtime-env, *nats-env]
      PORT: 4102
      DATABASE_URL: postgres://svc_billing:${BILLING_DB_PASSWORD:?}@postgres:5432/billing?sslmode=disable
    depends_on: *data-deps

  agent:
    <<: *node-service
    image: oasis/agent:${OASIS_IMAGE_TAG:-local}
    build:
      <<: *node-build
      args:
        <<: *node-build-args
        SERVICE: agent
    environment:
      <<: [*runtime-env, *nats-env]
      PORT: 4103
      DATABASE_URL: postgres://svc_agent:${AGENT_DB_PASSWORD:?}@postgres:5432/agent?sslmode=disable
    depends_on: *data-deps

  conversation:
    <<: *node-service
    image: oasis/conversation:${OASIS_IMAGE_TAG:-local}
    build:
      <<: *node-build
      args:
        <<: *node-build-args
        SERVICE: conversation
    environment:
      <<: [*runtime-env, *nats-env]
      PORT: 4104
      DATABASE_URL: postgres://svc_conversation:${CONVERSATION_DB_PASSWORD:?}@postgres:5432/conversation?sslmode=disable
      AGENT_URL: http://agent:4103
      MODEL_GATEWAY_URL: http://model-gateway:4108
      TASK_URL: http://task:4105
    depends_on: *data-deps

  task:
    <<: *node-service
    image: oasis/task:${OASIS_IMAGE_TAG:-local}
    build:
      <<: *node-build
      args:
        <<: *node-build-args
        SERVICE: task
    environment:
      <<: [*runtime-env, *nats-env]
      PORT: 4105
      DATABASE_URL: postgres://svc_task:${TASK_DB_PASSWORD:?}@postgres:5432/task?sslmode=disable
      HARNESS_URL: http://harness:4107
      MODEL_GATEWAY_URL: http://model-gateway:4108
      AGENT_URL: http://agent:4103
    depends_on: *data-deps

  canvas:
    <<: *node-service
    image: oasis/canvas:${OASIS_IMAGE_TAG:-local}
    build:
      <<: *node-build
      args:
        <<: *node-build-args
        SERVICE: canvas
    environment:
      <<: [*runtime-env, *nats-env]
      PORT: 4106
      DATABASE_URL: postgres://svc_canvas:${CANVAS_DB_PASSWORD:?}@postgres:5432/canvas?sslmode=disable
    depends_on: *data-deps

  harness:
    <<: *node-service
    image: oasis/harness:${OASIS_IMAGE_TAG:-local}
    build:
      <<: *node-build
      args:
        <<: *node-build-args
        SERVICE: harness
    environment:
      <<: [*runtime-env, *nats-env]
      PORT: 4107
      DATABASE_URL: postgres://svc_harness:${HARNESS_DB_PASSWORD:?}@postgres:5432/harness?sslmode=disable
      MODEL_GATEWAY_URL: http://model-gateway:4108
      S3_ENDPOINT: http://seaweedfs:8333
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?}
      DOCKER_SOCKET: /var/run/docker.sock
    # harness 要通过宿主机的 Docker 起沙箱容器（权限较大，只给 harness）。
    # socket 的属组在 Linux 上一般是 docker 组，用 DOCKER_SOCKET_GID 指定；Docker Desktop 上是 0。
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - ${DOCKER_SOCKET_GID:-0}
    depends_on:
      <<: *data-deps
      seaweedfs:
        condition: service_healthy
      sandbox-ingress:
        condition: service_healthy

  model-gateway:
    <<: *node-service
    # OpenRouter Key 只写在 services/model-gateway/.env 里；其余配置由下面的 environment 覆盖
    env_file:
      - path: ../../services/model-gateway/.env
        required: false
    image: oasis/model-gateway:${OASIS_IMAGE_TAG:-local}
    build:
      <<: *node-build
      args:
        <<: *node-build-args
        SERVICE: model-gateway
    environment:
      <<: [*runtime-env, *nats-env]
      PORT: 4108
      DATABASE_URL: postgres://svc_model_gateway:${MODEL_GATEWAY_DB_PASSWORD:?}@postgres:5432/model_gateway?sslmode=disable
      BILLING_URL: http://billing:4102
    depends_on: *data-deps

networks:
  default: {}
  # 沙箱容器所在的内部网络：不通外网，名字固定，harness 按名字把沙箱接进来
  sandbox:
    name: oasis-sandbox
    internal: true

volumes:
  postgres-data:
  valkey-data:
  nats-data:
  seaweedfs-data:
