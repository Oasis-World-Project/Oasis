# Git 钩子：提交前、推送前先在本地拦一道；推上去以后 CI（.github/workflows/ci.yml）再跑一遍检查和测试（工程规范 §7）。
pre-commit:
  parallel: true
  commands:
    naming:
      run: node scripts/check-engineering.mjs --only naming,images,tokens,layout,migrations
    lint:
      glob: '*.{js,mjs,cjs,ts,tsx}'
      run: pnpm exec eslint --max-warnings=0 {staged_files}
    format:
      glob: '*.{js,mjs,cjs,ts,tsx,json,yml,yaml,css}'
      run: pnpm exec prettier --check {staged_files}

pre-push:
  commands:
    engineering:
      run: node scripts/check-engineering.mjs
    typecheck:
      run: pnpm typecheck
