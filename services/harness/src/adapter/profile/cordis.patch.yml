# Oasis 自己的 dsh 组合（ADR 0003 §5）。镜像构建时从 dsh 自带的 sdk 模板复制出 oasis profile，再叠上这一层。
# 目标、内部规划、后台作业和代理树沿用原生实现；Oasis 只负责隔离、计费与生命周期衔接。
# 模型一律走 Oasis 的 model-gateway（经沙箱入口代理），凭每次运行专用的临时 Key 计费。
# 路由凭证由环境注入；完整目录与任务授权经 /workspace/in/.oasis-*.json 注入。

# ---- 复用原生 OpenRouter 型号、推理及回传规则，地址与凭证替换为计费网关 ----
- id: llm-pi-ai
  config:
    providers:
      openrouter:
        displayName: Oasis
        apiKeyEnv: OASIS_RUN_KEY
        api: openai-completions
        baseURL: !!js process.env.OASIS_MODEL_BASE_URL
        models: !!js >-
          (() => {
            const require = process.getBuiltinModule('node:module').createRequire('/usr/local/lib/node_modules/@deepseek-ai/dsh/package.json');
            const native = new Set(require('./node_modules/@earendil-works/pi-ai/dist/providers/all.js').getBuiltinModels('openrouter').map(m => m.id));
            return JSON.parse(process.getBuiltinModule('node:fs').readFileSync('/workspace/in/.oasis-models.json', 'utf8')).map(m => {
              if (!native.has(m.id)) return m;
              const { maxTokens, reasoningEfforts, compat, ...capacity } = m;
              return { ...capacity, ...(reasoningEfforts === false ? { reasoningEfforts: false } : {}) };
            });
          })()
        reasoning: high
- id: agent-default-model
  config:
    provider: openrouter
    model: !!js process.env.OASIS_MODEL

# ---- 关掉：DeepSeek 自家账号、模型和网页搜索（模型和联网都走 Oasis） ----
- id: deepseek-account
  disabled: true
- id: deepseek-llm-api-extensions
  disabled: true
- id: llm-deepseek
  disabled: true
- id: llm-deepseek-account
  disabled: true
- id: session-log-deepseek
  disabled: true
- id: plugin-package-inventory-deepseek
  disabled: true
- id: web
  disabled: true
- id: web-search-deepseek
  disabled: true
- id: web-deepseek-api
  disabled: true
- id: web-fetch-http
  disabled: true
- id: tool-web
  disabled: true

# ---- 关掉：运行中问用户（Oasis 规定节点里的 AI 不主动追问） ----
- id: user-questions
  disabled: true

# ---- 内部规划/目标/后台作业和子代理沿用 DSH；交互式计划审批不适用于已获授权的后台任务 ----
- id: plan-mode
  disabled: true

# ---- 关掉：插件管理、远程访问、热重载、遥测、自动起标题（会多花一次模型调用） ----
- id: tool-plugin-manager
  disabled: true
- id: plugin-manager
  disabled: true
- id: remote-access
  disabled: true
- id: typert-gateway
  disabled: true
- id: hmr
  disabled: true
- id: otel
  disabled: true
- id: session-telemetry-otel
  disabled: true
- id: session-title
  disabled: true
- id: session-title-llm
  disabled: true
- id: command-feedback
  disabled: true
- id: mcp-resources
  disabled: true

# ---- 关掉：Windows PowerShell、切换工作目录（沙箱是 Linux，工作目录固定为 /workspace） ----
- id: pwsh-sandbox
  disabled: true
- id: tool-pwsh
  disabled: true
- id: tool-working-directory
  disabled: true

# ---- 补上：agent-loop 要能看到会话存储，session/resume 才能用 ----
# dsh 自带的 sdk 模板没给 agent-loop 注入 sessionPersistence，接着原会话（关卡退回修改、停止后继续、
# 讨论的下一轮）时会报「session persistence is not configured」。2026-10-22 实测加上后可以跨容器恢复。
- id: agent-loop
  inject:
    - sessionPersistence

# 产品工作流只约束交付；子任务内部使用原生目标和代理树。
- id: tool-subagent
  disabled: true
- id: tool-subagent-fork
  config:
    provider: fork
    toolName: subagent_fork
    maxDepth: provider-managed
- id: sdk-jsonrpc-server
  config:
    maxTokensAsSuccess: false
- insert:
    - id: agent-preset-registry
      name: '@deepseek-ai/dsh-agent-preset-registry'
      config:
        default: oasis
    - id: preset-oasis
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: oasis
        plugins:
          - id: tool-subagent
            name: '@deepseek-ai/dsh-tool-subagent'
            inject: [subagentModelSelection]
            config:
              provider: spawn
              toolName: subagent
              modelSelectionSettings: true
              maxDepth: provider-managed
    - id: subagent-model-selection-settings
      name: '@deepseek-ai/dsh-tool-subagent/model-selection-settings'
      config:
        enabled: true
        allowedModels: !!js >-
          JSON.parse(process.getBuiltinModule('node:fs').readFileSync('/workspace/in/.oasis-models.json', 'utf8')).map(m => ({ provider: 'openrouter', model: m.id }))
    - id: oasis-node-goal
      name: /opt/oasis/node-goal.mjs
