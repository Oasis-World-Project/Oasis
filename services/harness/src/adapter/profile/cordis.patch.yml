# Oasis 自己的 dsh 组合（ADR 0003 §5）。镜像构建时从 dsh 自带的 sdk 模板复制出 oasis profile，再叠上这一层。
# 原则：dsh 只当可拆装的底座。用不上的插件一律关掉（少一个工具，每次模型调用就少一段提示词）；
# 模型一律走 Oasis 的 model-gateway（经沙箱入口代理），凭每次运行专用的临时 Key 计费。
# 运行时由环境变量注入：OASIS_MODEL_BASE_URL、OASIS_RUN_KEY、OASIS_MODELS（JSON 数组）、OASIS_MODEL。

# ---- 模型：只有一个路由 oasis，指向 model-gateway ----
- id: llm-pi-ai
  config:
    providers:
      oasis:
        displayName: Oasis
        apiKeyEnv: OASIS_RUN_KEY
        api: openai-completions
        baseURL: !!js process.env.OASIS_MODEL_BASE_URL
        models: !!js JSON.parse(process.env.OASIS_MODELS ?? '[]')
- id: agent-default-model
  config:
    provider: oasis
    model: !!js process.env.OASIS_MODEL

