# Oasis 自己的 dsh 组合：云端沙箱和用户电脑上是同一份，地方不同的路径都从环境变量来
# （沙箱里的默认值见下面每处的 ??）。镜像构建时从 dsh 自带的 sdk 模板复制出 oasis profile，
# harness 每轮再把这一层和同目录的两个插件（node-goal.mjs、approval.mjs）现放进来。
# 目标、内部规划、后台作业和代理树沿用原生实现；Oasis 只负责隔离、计费、权限确认与生命周期衔接。
# 模型一律走 Oasis 的 model-gateway（沙箱经入口代理，用户电脑经 gateway），凭每次运行专用的临时 Key 计费。
# 路由凭证由环境注入；完整目录与任务授权经 $OASIS_IN/.oasis-*.json 注入（沙箱里是 /workspace/in）。

# ---- 复用原生 OpenRouter 型号、推理及回传规则，地址与凭证替换为计费网关 ----
- id: llm-pi-ai
  config:
    providers:
      openrouter:
        displayName: Oasis
        apiKeyEnv: OASIS_RUN_KEY
        api: openai-completions
        baseURL: !!js process.env.OASIS_MODEL_BASE_URL
        models: !!js >-
          (() => {
            const fs = process.getBuiltinModule('node:fs');
            const path = process.getBuiltinModule('node:path');
            const pkg = process.env.OASIS_DSH_PACKAGE ?? '/usr/local/lib/node_modules/@deepseek-ai/dsh/package.json';
            const require = process.getBuiltinModule('node:module').createRequire(pkg);
            let dir = path.dirname(pkg), all;
            for (;;) {
              const file = path.join(dir, 'node_modules', '@earendil-works', 'pi-ai', 'dist', 'providers', 'all.js');
              if (fs.existsSync(file)) { all = file; break; }
              if (path.dirname(dir) === dir) throw new Error('找不到 dsh 自带的 pi-ai');
              dir = path.dirname(dir);
            }
            const native = new Set(require(all).getBuiltinModels('openrouter').map(m => m.id));
            const models = path.join(process.env.OASIS_IN ?? '/workspace/in', '.oasis-models.json');
            return JSON.parse(fs.readFileSync(models, 'utf8')).map(m => {
              if (!native.has(m.id)) return m;
              const { maxTokens, reasoningEfforts, compat, ...capacity } = m;
              return { ...capacity, ...(reasoningEfforts === false ? { reasoningEfforts: false } : {}) };
            });
          })()
        # 不设整条路由的默认思考档：思考档由 node-goal 按每个型号原生的最高一档选，不会思考的型号不带。
        # 设了（原来的 reasoning: high）会套到每个型号上，不会思考的型号（如 Llama 4 Maverick）每一轮都被
        # dsh 拒绝：does not support reasoning effort "high"（2026-11-14 第 4 阶段量型号时发现）。
- id: agent-default-model
  config:
    provider: openrouter
    model: !!js process.env.OASIS_MODEL

# 原生图片对象和请求变体必须与会话一起持久化/归档，不能留在容器临时层。
# attachment-local 只用此 home 定位附件，原生日志的目录保持不变。
- id: attachment-local
  config:
    dshHome: !!js dshHomePath('sessions')

# ---- 权限：只读 / 可改项目文件夹 / 完全访问（只在用户电脑上分档，云端沙箱用默认的完全访问），超出时
# 问用户（ask）或不做（-strict）。每个会话按这一轮的设置（OASIS_PERMISSION）切过去（approval.mjs）；
# 超出权限要用户确认时由 approval.mjs 问 Oasis，用户在聊天里的确认卡上答。----
- id: permission
  config:
    presets:
      read-only:
        sandbox: read-only
        approval: ask
      read-only-strict:
        sandbox: read-only
        approval: never
      workspace-write:
        sandbox: workspace-write
        approval: ask
      workspace-write-strict:
        sandbox: workspace-write
        approval: never
      danger-full-access:
        sandbox: danger-full-access
        approval: never
    defaultPreset: !!js process.env.OASIS_PERMISSION ?? 'danger-full-access'

# ---- 关掉：DeepSeek 自家账号、模型和网页搜索（模型和联网都走 Oasis） ----
- id: deepseek-account
  disabled: true
- id: deepseek-llm-api-extensions
  disabled: true
- id: llm-deepseek
  disabled: true
- id: llm-deepseek-account
  disabled: true
- id: session-log-deepseek
  disabled: true
- id: plugin-package-inventory-deepseek
  disabled: true
- id: web
  disabled: true
- id: web-search-deepseek
  disabled: true
- id: web-deepseek-api
  disabled: true
- id: web-fetch-http
  disabled: true
- id: tool-web
  disabled: true

# ---- 关掉：运行中弹窗问用户（要用户选时 AI 在回复里写 oasis-questions 代码块） ----
- id: user-questions
  disabled: true

# ---- 内部规划/目标/后台作业和子代理沿用 DSH；交互式计划审批不适用于已获授权的后台任务 ----
- id: plan-mode
  disabled: true

# ---- 关掉：插件管理、远程访问、热重载、遥测、自动起标题（会多花一次模型调用） ----
- id: tool-plugin-manager
  disabled: true
- id: plugin-manager
  disabled: true
- id: remote-access
  disabled: true
- id: typert-gateway
  disabled: true
- id: hmr
  disabled: true
- id: otel
  disabled: true
- id: session-telemetry-otel
  disabled: true
- id: session-title
  disabled: true
- id: session-title-llm
  disabled: true
- id: command-feedback
  disabled: true
- id: mcp-resources
  disabled: true

# ---- 关掉：切换工作目录（工作目录固定：沙箱里是 /workspace，用户电脑上是选的项目文件夹）。
# 命令行工具按平台由 dsh 自己挑：Linux 用 bash，Windows 用 PowerShell ----
- id: tool-working-directory
  disabled: true

# ---- 补上：agent-loop 要能看到会话存储，session/resume 才能用 ----
# dsh 自带的 sdk 模板没给 agent-loop 注入 sessionPersistence，接着原会话（下一轮、停止后继续、
# 讨论的下一轮）时会报「session persistence is not configured」。2026-10-22 实测加上后可以跨容器恢复。
- id: agent-loop
  inject:
    - sessionPersistence

# 平台只约束交付；子任务内部使用原生目标和代理树。
- id: tool-subagent
  disabled: true
- id: tool-subagent-fork
  config:
    provider: fork
    toolName: subagent_fork
    maxDepth: provider-managed
- id: sdk-jsonrpc-server
  config:
    maxTokensAsSuccess: false
- insert:
    - id: agent-preset-registry
      name: '@deepseek-ai/dsh-agent-preset-registry'
      config:
        default: oasis
    - id: preset-oasis
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: oasis
        plugins:
          - id: tool-subagent
            name: '@deepseek-ai/dsh-tool-subagent'
            inject: [subagentModelSelection]
            config:
              provider: spawn
              toolName: subagent
              modelSelectionSettings: true
              maxDepth: provider-managed
    - id: subagent-model-selection-settings
      name: '@deepseek-ai/dsh-tool-subagent/model-selection-settings'
      config:
        enabled: true
        allowedModels: !!js >-
          JSON.parse(process.getBuiltinModule('node:fs').readFileSync(process.getBuiltinModule('node:path').join(process.env.OASIS_IN ?? '/workspace/in', '.oasis-models.json'), 'utf8')).map(m => ({ provider: 'openrouter', model: m.id }))
    # Oasis 的两个插件和这份组合放在同一个目录（相对路径按组合目录解析，Windows、Linux 一样）
    - id: oasis-node-goal
      name: ./node-goal.mjs
    - id: oasis-approval
      name: ./approval.mjs
