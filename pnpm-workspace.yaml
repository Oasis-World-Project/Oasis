packages:
  - apps/*
  - services/*
  - packages/*

# 依赖一律锁定精确版本（dsh 处于开发者预览期，尤其不能漂移）
saveExact: true
engineStrict: true

# 各工作区共用的依赖版本，package.json 里写 "catalog:" 引用，保证全仓同一版本
catalog:
  '@fastify/http-proxy': 11.6.5
  '@nats-io/jetstream': 3.4.0
  '@nats-io/transport-node': 3.4.0
  '@types/node': 24.19.2
  '@types/pg': 8.23.1
  dbmate: 2.37.0
  drizzle-orm: 0.45.4
  fastify: 5.12.7
  pg: 8.23.1
  pino: 10.4.0
  typescript: 6.0.3
  vite: 8.3.4
  vitest: 5.0.5
  zod: 4.6.7
# 只放行确认可信的依赖安装脚本（pnpm 11 默认全部拦截）
allowBuilds:
  # Electron 的程序文件在第一次启动时才下载（pnpm desktop），安装阶段不需要跑它的脚本
  electron: false
  lefthook: true

# vitest 也依赖 vite：统一成 catalog 里的同一个版本，避免一个仓库里出现两个 vite
overrides:
  vite: 'catalog:'
